<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wikidata Import</title>
  <style>
    :root {
      --bg: #071510;
      --bg-soft: #0e2219;
      --card: #113127;
      --card-2: #173e32;
      --text: #e8f4ee;
      --muted: #a8c3b5;
      --accent: #39c98a;
      --accent-2: #29a873;
      --danger: #ff6f7d;
      --warn: #f8c05d;
      --ok: #53e7a0;
      --radius: 16px;
      --shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #113027 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100dvh;
    }

    .container {
      width: min(1100px, 100% - 24px);
      margin: 20px auto 32px;
      display: grid;
      gap: 14px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid rgba(180, 255, 220, 0.15);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
    }

    h1 { margin: 0 0 6px; font-size: 1.5rem; }
    .sub { margin: 0; color: var(--muted); }

    .hidden { display: none !important; }
    .muted { color: var(--muted); }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .admin-nav { margin-bottom: 8px; }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: #0a1f17;
      border: 1px solid #29614c;
      border-radius: 12px;
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      color: #092017;
      background: var(--accent);
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover { background: var(--accent-2); }
    .btn.secondary { background: #205e48; color: var(--text); }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid #2f7259; }
    .btn.danger { background: #74313b; color: #ffd7dd; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .stack { display: grid; gap: 8px; }

    .status {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-size: 0.95rem;
      min-height: 42px;
      display: flex;
      align-items: center;
    }

    .status.info { background: #1d4638; border-color: #2f7f62; }
    .status.success { background: #174431; border-color: #46bf8c; color: #c8f8e3; }
    .status.error { background: #4a2028; border-color: #c66473; color: #ffd7dd; }
    .status.warn { background: #4a3b1f; border-color: #c7a45f; color: #ffe8b8; }

    .example-buttons { display: flex; flex-wrap: wrap; gap: 8px; }

    .results {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(192, 255, 218, 0.16);
      border-radius: 14px;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .card-title {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.3;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: #1f5846;
      color: #d9f9ec;
      border: 1px solid #347b61;
    }

    pre {
      margin: 0;
      background: #0a1f18;
      border: 1px solid #2f6f58;
      color: #c6f8e2;
      border-radius: 12px;
      padding: 10px;
      font-size: 0.78rem;
      overflow: auto;
      max-height: 300px;
    }

    a { color: #85eebd; }

    @media (min-width: 720px) {
      .results { grid-template-columns: repeat(2, 1fr); }
      h1 { font-size: 1.85rem; }
    }

    @media (min-width: 980px) {
      .results { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="panel stack">
      <div class="row admin-nav">
        <a class="btn ghost" href="adm-topic-overview.html">Zur Topic Übersicht</a>
        <a class="btn ghost" href="adm-swipe-card-generator.html">Zum Swipe Card Generator</a>
        <a class="btn ghost" href="adm-church-import.html">🕍 Kirche Import</a>
      </div>
      <h1>Wikidata Import</h1>
      <p class="sub">Suche ein Thema und importiere es als Topic in Firestore.</p>
      <div class="row">
        <strong>Angemeldet:</strong>
        <span id="auth-email" class="muted">Nicht eingeloggt</span>
      </div>
    </section>

    <section class="panel stack" id="login-panel">
      <h2>Admin Login</h2>
      <input id="email-input" type="email" placeholder="E-Mail" autocomplete="email" />
      <input id="password-input" type="password" placeholder="Passwort" autocomplete="current-password" />
      <div class="row">
        <button id="login-btn" class="btn">Login</button>
        <button id="logout-btn" class="btn danger hidden">Logout</button>
      </div>
    </section>

    <section class="panel stack" id="import-panel">
      <div class="row">
        <input id="search-input" type="text" placeholder="Wikidata suchen (z. B. Albert Einstein)" />
        <button id="search-btn" class="btn">Suchen</button>
      </div>

      <div class="example-buttons">
        <button class="btn ghost example" data-query="Kalter Krieg">Kalter Krieg</button>
        <button class="btn ghost example" data-query="Römisches Reich">Römisches Reich</button>
        <button class="btn ghost example" data-query="Napoleon Bonaparte">Napoleon Bonaparte</button>
        <button class="btn ghost example" data-query="Schwarzes Loch">Schwarzes Loch</button>
        <button class="btn ghost example" data-query="Französische Revolution">Französische Revolution</button>
        <button class="btn ghost example" data-query="Albert Einstein">Albert Einstein</button>
      </div>
    </section>

    <section class="panel">
      <div id="status-box" class="status info">Bereit.</div>
    </section>

    <section class="panel stack">
      <h2>Suchergebnisse</h2>
      <div id="results" class="results"></div>
    </section>

    <section class="panel stack">
      <h2>Details</h2>
      <div id="details" class="muted">Noch kein Item ausgewählt.</div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getFirestore, doc, setDoc, addDoc, collection, serverTimestamp, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBOjkDk1Mmr79wY7bpKHQ5jidqwuHDo_kg",
      authDomain: "swipe-82eeb.firebaseapp.com",
      projectId: "swipe-82eeb",
      storageBucket: "swipe-82eeb.firebasestorage.app",
      messagingSenderId: "649929298401",
      appId: "1:649929298401:web:d94f1a5ebf1407ac6502a0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Firestore Rules müssen Admin-Schreibrechte serverseitig absichern.

    const WIKIDATA_API = "https://www.wikidata.org/w/api.php";
    const MAX_CLAIM_PROPERTIES = 50;

    const els = {
      authEmail: document.getElementById("auth-email"),
      loginPanel: document.getElementById("login-panel"),
      importPanel: document.getElementById("import-panel"),
      emailInput: document.getElementById("email-input"),
      passwordInput: document.getElementById("password-input"),
      loginBtn: document.getElementById("login-btn"),
      logoutBtn: document.getElementById("logout-btn"),
      searchInput: document.getElementById("search-input"),
      searchBtn: document.getElementById("search-btn"),
      results: document.getElementById("results"),
      details: document.getElementById("details"),
      statusBox: document.getElementById("status-box"),
      exampleButtons: [...document.querySelectorAll(".example")]
    };

    let isAuthenticated = false;
    let currentImportingQid = null;

    function showStatus(message, type = "info") {
      els.statusBox.textContent = message;
      els.statusBox.className = `status ${type}`;
    }

    function setUiAuthState(user) {
      isAuthenticated = Boolean(user);
      els.authEmail.textContent = user?.email || "Nicht eingeloggt";
      els.logoutBtn.classList.toggle("hidden", !isAuthenticated);
      const disabled = !isAuthenticated;
      els.searchInput.disabled = disabled;
      els.searchBtn.disabled = disabled;
      els.exampleButtons.forEach((btn) => btn.disabled = disabled);
      if (!isAuthenticated) {
        showStatus("Bitte einloggen, um Suche und Import zu nutzen.", "warn");
      } else {
        showStatus("Login erfolgreich. Du kannst suchen und importieren.", "success");
      }
    }

    function getLabel(entity, lang) {
      return entity?.labels?.[lang]?.value || "";
    }

    function getDescription(entity, lang) {
      return entity?.descriptions?.[lang]?.value || "";
    }

    function getAliases(entity, lang) {
      return (entity?.aliases?.[lang] || []).map((a) => a.value).filter(Boolean);
    }

    function getSitelink(entity, siteKey) {
      const title = entity?.sitelinks?.[siteKey]?.title;
      if (!title) return "";
      const base = siteKey === "dewiki" ? "https://de.wikipedia.org/wiki/" : "https://en.wikipedia.org/wiki/";
      return `${base}${encodeURIComponent(title.replace(/ /g, "_"))}`;
    }

    function countClaims(entity) {
      return Object.keys(entity?.claims || {}).length;
    }

    function buildWikidataApiUrl(params) {
      const usp = new URLSearchParams({ ...params, format: "json", origin: "*" });
      return `${WIKIDATA_API}?${usp.toString()}`;
    }

    async function wikidataFetch(params) {
      const url = buildWikidataApiUrl(params);
      const headers = { "Api-User-Agent": "SwipeKnowledgePrototype/0.1 (replace-with-contact-url-or-email)" };
      try {
        const response = await fetch(url, { headers });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (e) {
        const fallback = await fetch(url);
        if (!fallback.ok) throw new Error(`HTTP ${fallback.status} (Fallback)`);
        return await fallback.json();
      }
    }

    async function searchWikidata(query) {
      return wikidataFetch({
        action: "wbsearchentities",
        search: query,
        language: "de",
        uselang: "de",
        type: "item",
        limit: "10"
      });
    }

    async function loadWikidataEntity(qid) {
      if (!/^Q\d+$/i.test(qid)) throw new Error("Ungültige Q-ID");
      const data = await wikidataFetch({
        action: "wbgetentities",
        ids: qid.toUpperCase(),
        languages: "de|en",
        props: "labels|descriptions|aliases|claims|sitelinks"
      });
      const entity = data?.entities?.[qid.toUpperCase()];
      if (!entity || entity.missing !== undefined) throw new Error("Entity nicht gefunden");
      return entity;
    }

    function limitClaimsRaw(claims) {
      const keys = Object.keys(claims || {});
      const total = keys.length;
      const limitedKeys = keys.slice(0, MAX_CLAIM_PROPERTIES);
      const limited = Object.fromEntries(limitedKeys.map((k) => [k, claims[k]]));
      return {
        claimsRaw: limited,
        claimsMeta: {
          totalPropertyCount: total,
          storedPropertyCount: limitedKeys.length,
          truncated: total > limitedKeys.length
        }
      };
    }

    function normalizeWikidataEntity(entity) {
      const qid = entity.id;
      const { claimsRaw, claimsMeta } = limitClaimsRaw(entity.claims || {});
      return {
        wikidataId: qid,
        entityType: "wikidata_item",
        title: { de: getLabel(entity, "de"), en: getLabel(entity, "en") },
        description: { de: getDescription(entity, "de"), en: getDescription(entity, "en") },
        aliases: { de: getAliases(entity, "de"), en: getAliases(entity, "en") },
        sitelinks: { dewiki: getSitelink(entity, "dewiki"), enwiki: getSitelink(entity, "enwiki") },
        claimsRaw,
        claimsMeta,
        mainCategory: "unknown",
        topicType: "unknown",
        tags: [],
        sourceIds: [`wikidata_${qid}`],
        import: { source: "wikidata", importedAt: serverTimestamp(), lastFetchedAt: serverTimestamp() },
        contentStatus: {
          hasShortCard: false,
          hasMediumCard: false,
          hasLongCard: false,
          reviewStatus: "raw_import"
        },
        status: "imported",
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      };
    }

    async function importEntityToFirestore(entity) {
      const qid = entity.id;
      const normalized = normalizeWikidataEntity(entity);
      const topicRef = doc(db, "topics", qid);
      const existingSnap = await getDoc(topicRef);
      const existingTopic = existingSnap.exists() ? (existingSnap.data() || {}) : null;
      if (existingTopic) showStatus("Bereits vorhanden – wird aktualisiert", "warn");

      const topicPayload = {
        wikidataId: normalized.wikidataId,
        entityType: normalized.entityType,
        title: normalized.title,
        description: normalized.description,
        aliases: normalized.aliases,
        sitelinks: normalized.sitelinks,
        claimsRaw: normalized.claimsRaw,
        claimsMeta: normalized.claimsMeta,
        sourceIds: Array.from(new Set([...(Array.isArray(existingTopic?.sourceIds) ? existingTopic.sourceIds : []), `wikidata_${qid}`])),
        import: {
          source: "wikidata",
          importedAt: existingTopic?.import?.importedAt || serverTimestamp(),
          lastFetchedAt: serverTimestamp()
        },
        createdAt: existingTopic?.createdAt || serverTimestamp(),
        updatedAt: serverTimestamp()
      };

      try {
        await setDoc(topicRef, topicPayload, { merge: true });

        const sourceRef = doc(db, "sourceDocs", `wikidata_${qid}`);
        await setDoc(sourceRef, {
          sourceType: "wikidata",
          wikidataId: qid,
          title: normalized.title.de || normalized.title.en || qid,
          url: `https://www.wikidata.org/wiki/${qid}`,
          license: "CC0",
          publisher: "Wikidata",
          fetchedAt: serverTimestamp(),
          language: "de",
          trustLevel: "high"
        }, { merge: true });

        await addDoc(collection(db, "importRuns"), {
          type: "wikidata_single_import",
          wikidataId: qid,
          title: normalized.title.de || normalized.title.en || qid,
          status: "success",
          createdAt: serverTimestamp()
        });

        return { ok: true, normalized };
      } catch (error) {
        await addDoc(collection(db, "importRuns"), {
          type: "wikidata_single_import",
          wikidataId: qid,
          title: normalized.title.de || normalized.title.en || qid,
          status: "error",
          errorMessage: error?.message || String(error),
          createdAt: serverTimestamp()
        });
        throw error;
      }
    }

    function renderEntityDetails(entity) {
      const normalized = normalizeWikidataEntity(entity);
      const claimCount = countClaims(entity);
      const dewiki = normalized.sitelinks.dewiki;
      const enwiki = normalized.sitelinks.enwiki;

      els.details.innerHTML = "";
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h3 class="card-title">${entity.id} · ${normalized.title.de || normalized.title.en || "Ohne Label"}</h3>
        <div class="chips">
          <span class="chip">Claims: ${claimCount}</span>
          <span class="chip">Claims gespeichert: ${normalized.claimsMeta.storedPropertyCount}/${normalized.claimsMeta.totalPropertyCount}</span>
          <span class="chip">Truncated: ${normalized.claimsMeta.truncated ? "Ja" : "Nein"}</span>
        </div>
        <p><strong>DE Label:</strong> ${normalized.title.de || "-"}<br>
        <strong>EN Label:</strong> ${normalized.title.en || "-"}</p>
        <p><strong>DE Beschreibung:</strong> ${normalized.description.de || "-"}<br>
        <strong>EN Beschreibung:</strong> ${normalized.description.en || "-"}</p>
        <p><strong>Aliases DE:</strong> ${normalized.aliases.de.join(", ") || "-"}<br>
        <strong>Aliases EN:</strong> ${normalized.aliases.en.join(", ") || "-"}</p>
        <p><strong>Wikipedia DE:</strong> ${dewiki ? `<a href="${dewiki}" target="_blank" rel="noopener">Link</a>` : "-"}<br>
        <strong>Wikipedia EN:</strong> ${enwiki ? `<a href="${enwiki}" target="_blank" rel="noopener">Link</a>` : "-"}</p>
        <h4>Normalisierte Vorschau</h4>
        <pre>${JSON.stringify({ ...normalized, import: { ...normalized.import, importedAt: "serverTimestamp()", lastFetchedAt: "serverTimestamp()" }, createdAt: "serverTimestamp()", updatedAt: "serverTimestamp()" }, null, 2)}</pre>
      `;
      els.details.appendChild(card);
    }

    function renderSearchResults(results) {
      els.results.innerHTML = "";
      if (!results.length) {
        els.results.innerHTML = `<div class="muted">Keine Ergebnisse gefunden.</div>`;
        return;
      }

      results.forEach((item) => {
        const card = document.createElement("article");
        card.className = "card";

        const importLabel = currentImportingQid === item.id ? "Import läuft..." : "Importieren";
        card.innerHTML = `
          <h3 class="card-title">${item.label || "Ohne Label"}</h3>
          <div class="chips">
            <span class="chip">${item.id}</span>
            ${item.match?.text ? `<span class="chip">Match: ${item.match.text}</span>` : ""}
            ${item.alias ? `<span class="chip">Alias: ${item.alias}</span>` : ""}
          </div>
          <p class="muted">${item.description || "Keine Beschreibung"}</p>
          <div class="row">
            <button class="btn secondary" data-action="details" data-qid="${item.id}">Details laden</button>
            <button class="btn ghost" data-action="preview" data-qid="${item.id}">Nur Vorschau, nicht importieren</button>
            <button class="btn" data-action="import" data-qid="${item.id}" ${!isAuthenticated || currentImportingQid === item.id ? "disabled" : ""}>${importLabel}</button>
          </div>
        `;
        els.results.appendChild(card);
      });
    }

    async function runSearch() {
      if (!isAuthenticated) return showStatus("Bitte zuerst einloggen.", "warn");
      const query = els.searchInput.value.trim();
      if (!query) return showStatus("Bitte einen Suchbegriff eingeben.", "warn");
      try {
        showStatus("Suche läuft...", "info");
        const data = await searchWikidata(query);
        const results = data?.search || [];
        renderSearchResults(results);
        showStatus(`${results.length} Ergebnis(se) gefunden.`, results.length ? "success" : "warn");
      } catch (error) {
        showStatus(`Suchfehler: ${error.message}`, "error");
      }
    }

    async function handleResultAction(action, qid, importButton = null) {
      try {
        if (!qid) throw new Error("Ungültige Q-ID");
        showStatus(`${action === "import" ? "Import" : "Details"} für ${qid} läuft...`, "info");
        const entity = await loadWikidataEntity(qid);
        renderEntityDetails(entity);

        if (action === "import") {
          if (!isAuthenticated) throw new Error("Nicht eingeloggt");
          currentImportingQid = qid;
          if (importButton) {
            importButton.disabled = true;
            importButton.textContent = "Import läuft...";
          }
          await importEntityToFirestore(entity);
          showStatus(`Import erfolgreich: ${qid}`, "success");
          if (importButton) importButton.textContent = "Importiert";
        } else {
          showStatus(`Details geladen: ${qid}`, "success");
        }
      } catch (error) {
        showStatus(`Fehler: ${error.message}`, "error");
      } finally {
        currentImportingQid = null;
      }
    }

    els.loginBtn.addEventListener("click", async () => {
      const email = els.emailInput.value.trim();
      const password = els.passwordInput.value;
      if (!email || !password) return showStatus("Bitte E-Mail und Passwort eingeben.", "warn");
      try {
        showStatus("Login läuft...", "info");
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        showStatus(`Login fehlgeschlagen: ${error.message}`, "error");
      }
    });

    els.logoutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        showStatus("Abgemeldet.", "info");
      } catch (error) {
        showStatus(`Logout-Fehler: ${error.message}`, "error");
      }
    });

    els.searchBtn.addEventListener("click", runSearch);
    els.searchInput.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });

    els.exampleButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        els.searchInput.value = btn.dataset.query || "";
        runSearch();
      });
    });

    els.results.addEventListener("click", async (e) => {
      const target = e.target.closest("button[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      const qid = target.dataset.qid;
      if (action === "import" && !isAuthenticated) {
        showStatus("Bitte zuerst einloggen.", "warn");
        return;
      }
      await handleResultAction(action === "preview" ? "details" : action, qid, action === "import" ? target : null);
    });

    onAuthStateChanged(auth, (user) => setUiAuthState(user));
    setUiAuthState(null);
  </script>
</body>
</html>
