<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wissens-Themen Übersicht</title>
  <style>
    :root {
      --bg: #07120f;
      --bg-soft: #0d1d18;
      --card: #102821;
      --card-2: #153329;
      --text: #e9f7f1;
      --text-soft: #b6d0c6;
      --primary: #2bd48a;
      --primary-2: #1daf71;
      --danger: #f75f71;
      --warning: #f5c451;
      --muted: #3e5a50;
      --border: #28483d;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.26);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 700px at 20% -10%, #13372b 0%, var(--bg) 46%), var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    a { color: #9de7c7; }
    .container { width: min(1200px, 100% - 24px); margin: 16px auto 40px; }

    .header {
      background: linear-gradient(145deg, rgba(22, 52, 42, 0.96), rgba(14, 34, 28, 0.96));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 12px;
    }

    .title h1 { margin: 0; font-size: 1.3rem; }
    .title p { margin: 6px 0 0; color: var(--text-soft); }

    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .spacer { flex: 1; }

    .btn, button {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      background: #1a3f33;
    }

    .btn.primary { background: linear-gradient(145deg, var(--primary), var(--primary-2)); color: #04311f; }
    .btn.secondary { background: #1b3d31; border-color: var(--border); }
    .btn.danger { background: #4b1c24; border-color: #7d2f3c; color: #ffd9df; }
    .btn.ghost { background: transparent; border-color: var(--border); color: var(--text-soft); }

    .pill { background: #183b30; border: 1px solid var(--border); border-radius: 999px; padding: 6px 10px; color: var(--text-soft); font-size: .88rem; }
    .email { font-size: .92rem; color: var(--text-soft); }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #102821;
      color: var(--text-soft);
      display: none;
    }
    .status.show { display: block; }
    .status.success { border-color: #2e7f5a; color: #b9f6d7; }
    .status.error { border-color: #8f3341; color: #ffd0d7; }
    .status.info { border-color: #375f50; }

    .grid-stats {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      background: linear-gradient(165deg, #102921, #0e231c);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .stat .label { color: var(--text-soft); font-size: .86rem; }
    .stat .value { font-size: 1.3rem; margin-top: 6px; font-weight: 700; }

    .filters {
      margin-top: 16px;
      position: sticky;
      top: 8px;
      z-index: 5;
      background: rgba(7, 18, 15, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
    }

    .filter-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    input, select, textarea {
      width: 100%;
      background: #0f241d;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 11px;
      border-radius: 10px;
    }

    .topic-list { margin-top: 16px; display: grid; gap: 12px; }
    .topic-card {
      background: linear-gradient(155deg, #112b22, #0d211a);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .topic-title { margin: 0; font-size: 1.1rem; }
    .topic-sub { color: var(--text-soft); font-size: .9rem; margin-top: 4px; }
    .topic-desc { color: #d4ece1; margin-top: 10px; font-size: .94rem; }

    .meta, .badges, .actions, .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .meta .pill { font-size: .8rem; }

    .badge { border-radius: 999px; padding: 5px 9px; font-size: .78rem; border: 1px solid transparent; }
    .badge.ok { background: #173f2f; border-color: #2c7f5a; color: #bdf5d8; }
    .badge.no { background: #26342f; border-color: #4f615a; color: #c1cec8; }
    .badge.ready, .badge.approved { background: #173f2f; border-color: #2d815b; color: #bcf3d6; }
    .badge.raw_import { background: #24372f; border-color: #486156; color: #d1dfd8; }
    .badge.archived { background: #2f3332; border-color: #555d5a; color: #d4d7d6; }
    .badge.rejected { background: #42222a; border-color: #88404f; color: #ffd6de; }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      color: var(--text-soft);
      background: #0d1f19;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      z-index: 100;
    }

    .modal.show { display: flex; align-items: flex-end; }
    .modal-content {
      width: 100%;
      max-height: 95vh;
      overflow: auto;
      background: #0c1e18;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      border: 1px solid var(--border);
      padding: 14px;
    }

    .kv { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
    .kv .item { background: #102821; border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .k { color: var(--text-soft); font-size: .84rem; }
    .v { margin-top: 4px; }

    .danger-zone {
      margin-top: 16px;
      border: 1px solid #7e3341;
      background: #351920;
      border-radius: 12px;
      padding: 12px;
    }

    pre { background: #0b1814; border: 1px solid var(--border); padding: 10px; border-radius: 10px; overflow: auto; }

    @media (min-width: 860px) {
      .header { grid-template-columns: 1fr auto; align-items: center; }
      .grid-stats { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .filter-grid { grid-template-columns: 2fr 1fr 1fr 1fr 1fr; }
      .modal.show { align-items: center; justify-content: center; }
      .modal-content { width: min(980px, 95vw); border-radius: 18px; max-height: 90vh; }
      .kv { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">
        <div class="row"><a class="btn ghost" href="adm-wikidata-import.html">Zum Wikidata Import</a></div>
        <h1>Wissens-Themen Übersicht</h1>
        <p>Importierte Wikidata-Themen prüfen, filtern und für Swipe-Karten vorbereiten.</p>
      </div>
      <div class="row">
        <span class="email" id="currentUserEmail">Nicht eingeloggt</span>
        <button class="btn secondary" id="reloadBtn">Neu laden</button>
        <button class="btn secondary" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div id="statusBar" class="status"></div>

    <section id="loginSection" class="topic-card" style="margin-top:16px;">
      <h2 style="margin:0 0 10px;">Admin Login</h2>
      <div class="filter-grid" style="grid-template-columns: 1fr;">
        <input id="emailInput" type="email" placeholder="E-Mail" />
        <input id="passwordInput" type="password" placeholder="Passwort" />
        <button class="btn primary" id="loginBtn">Einloggen</button>
      </div>
    </section>

    <section id="overviewSection" style="display:none;">
      <div class="grid-stats" id="statsGrid"></div>
      <div class="filters"><div class="filter-grid" id="filterGrid"></div></div>
      <div id="topicList" class="topic-list"></div>
    </section>
  </div>

  <div id="detailModal" class="modal" aria-hidden="true">
    <div class="modal-content" id="modalContent"></div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyBOjkDk1Mmr79wY7bpKHQ5jidqwuHDo_kg", authDomain: "swipe-82eeb.firebaseapp.com", projectId: "swipe-82eeb", storageBucket: "swipe-82eeb.firebasestorage.app", messagingSenderId: "649929298401", appId: "1:649929298401:web:d94f1a5ebf1407ac6502a0" };

let app, db, auth;
let allTopics = [], filteredTopics = [], currentUser = null, currentModalTopicId = null;
let filters = { search: "", status: "all", reviewStatus: "all", mainCategory: "all", sort: "newest" };

function initFirebase() { app = initializeApp(firebaseConfig); db = getFirestore(app); auth = getAuth(app); }
function safeText(value) { return value == null ? "" : String(value); }
function getContentStatus(topic) { return { hasShortCard: false, hasMediumCard: false, hasLongCard: false, reviewStatus: "raw_import", ...(topic?.contentStatus || {}) }; }
function getReviewStatus(topic) { return getContentStatus(topic).reviewStatus || "raw_import"; }
function getTopicTitle(topic) { return safeText(topic?.title?.de || topic?.title?.en || topic?.wikidataId || "Unbenannt"); }
function formatDate(v){ try { if(!v) return ""; if (v?.toDate) return v.toDate().toLocaleString("de-DE"); const d = new Date(v); return isNaN(d.getTime()) ? "" : d.toLocaleString("de-DE"); } catch { return ""; } }
function parseTagsInput(v){ return safeText(v).split(",").map(x=>x.trim()).filter(Boolean); }

function showStatus(message, type="info"){ const el=document.getElementById("statusBar"); el.textContent=message; el.className=`status show ${type}`; }

function normalizeTopicDoc(docSnap){
  const data = docSnap.data() || {};
  return {
    id: docSnap.id,
    wikidataId: safeText(data.wikidataId || docSnap.id),
    title: data.title || {}, description: data.description || {}, aliases: data.aliases || {de:[],en:[]}, sitelinks: data.sitelinks || {},
    claimsMeta: data.claimsMeta || null, mainCategory: safeText(data.mainCategory || "unknown"), topicType: safeText(data.topicType || "unknown"),
    tags: Array.isArray(data.tags) ? data.tags : [], sourceIds: Array.isArray(data.sourceIds) ? data.sourceIds : [],
    import: data.import || {}, contentStatus: getContentStatus(data), status: safeText(data.status || "imported"), createdAt: data.createdAt, updatedAt: data.updatedAt, raw: data
  };
}

async function loadTopics(){
  if(!currentUser) return;
  try {
    showStatus("Lade Topics...", "info");
    const snap = await getDocs(query(collection(db, "topics"), orderBy("updatedAt", "desc")));
    allTopics = snap.docs.map(normalizeTopicDoc);
    renderFilters(); applyFiltersAndSort(); renderStats();
    showStatus(`${allTopics.length} Topics geladen`, "success");
    if(allTopics.length>500) showStatus("Viele Topics geladen – später Pagination einbauen.", "info");
  } catch (e) {
    try { const snap = await getDocs(collection(db, "topics")); allTopics = snap.docs.map(normalizeTopicDoc); renderFilters(); applyFiltersAndSort(); renderStats(); showStatus(`${allTopics.length} Topics geladen`, "success"); }
    catch(err){ showStatus("Fehler beim Laden", "error"); }
  }
}

function renderStats(){
  const cs = allTopics.map(t=>getContentStatus(t));
  const vals = [
    ["Topics total", allTopics.length], ["raw_import", allTopics.filter(t=>getReviewStatus(t)==="raw_import").length], ["ready", allTopics.filter(t=>t.status==="ready").length],
    ["mit Short Card", cs.filter(c=>c.hasShortCard).length], ["mit Medium Card", cs.filter(c=>c.hasMediumCard).length], ["mit Long Card", cs.filter(c=>c.hasLongCard).length]
  ];
  document.getElementById("statsGrid").innerHTML = vals.map(([l,v])=>`<div class="stat"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("");
}

function renderFilters(){
  const cats = [...new Set(allTopics.map(t=>t.mainCategory || "unknown").filter(Boolean))]; if(!cats.includes("unknown")) cats.unshift("unknown");
  document.getElementById("filterGrid").innerHTML = `
    <input id="filterSearch" placeholder="Suche nach Q-ID, Titel, Beschreibung, Tags" value="${safeText(filters.search)}" />
    <select id="filterStatus"><option value="all">Alle Status</option><option>imported</option><option>ready</option><option>draft</option><option>archived</option></select>
    <select id="filterReview"><option value="all">Alle ReviewStatus</option><option>raw_import</option><option>needs_review</option><option>approved</option><option>rejected</option></select>
    <select id="filterCategory"><option value="all">Alle Kategorien</option>${cats.map(c=>`<option value="${c}">${c}</option>`).join("")}</select>
    <select id="filterSort"><option value="newest">Neueste zuerst</option><option value="oldest">Älteste zuerst</option><option value="title_asc">Titel A-Z</option><option value="title_desc">Titel Z-A</option><option value="wikidata">Wikidata-ID</option></select>
  `;
  document.getElementById("filterStatus").value = filters.status; document.getElementById("filterReview").value = filters.reviewStatus; document.getElementById("filterCategory").value = filters.mainCategory; document.getElementById("filterSort").value = filters.sort;
  ["filterSearch","filterStatus","filterReview","filterCategory","filterSort"].forEach(id=>document.getElementById(id).addEventListener("input", ()=>{ filters.search=document.getElementById("filterSearch").value.trim().toLowerCase(); filters.status=document.getElementById("filterStatus").value; filters.reviewStatus=document.getElementById("filterReview").value; filters.mainCategory=document.getElementById("filterCategory").value; filters.sort=document.getElementById("filterSort").value; applyFiltersAndSort(); }));
}

function applyFiltersAndSort(){
  filteredTopics = allTopics.filter(t=>{
    const searchBlob = [t.wikidataId,t.title?.de,t.title?.en,t.description?.de,t.description?.en,(t.tags||[]).join(" ")].join(" ").toLowerCase();
    if(filters.search && !searchBlob.includes(filters.search)) return false;
    if(filters.status!=="all" && t.status!==filters.status) return false;
    if(filters.reviewStatus!=="all" && getReviewStatus(t)!==filters.reviewStatus) return false;
    if(filters.mainCategory!=="all" && t.mainCategory!==filters.mainCategory) return false;
    return true;
  });
  filteredTopics.sort((a,b)=>{ switch(filters.sort){ case "oldest": return (new Date(a.updatedAt?.toDate?.()||0))-(new Date(b.updatedAt?.toDate?.()||0)); case "title_asc": return getTopicTitle(a).localeCompare(getTopicTitle(b),"de"); case "title_desc": return getTopicTitle(b).localeCompare(getTopicTitle(a),"de"); case "wikidata": return safeText(a.wikidataId).localeCompare(safeText(b.wikidataId),"de"); default: return (new Date(b.updatedAt?.toDate?.()||0))-(new Date(a.updatedAt?.toDate?.()||0)); } });
  renderTopicCards();
}

function renderTopicCard(topic){
  const c = getContentStatus(topic), rev=getReviewStatus(topic);
  const desc = safeText(topic.description?.de || topic.description?.en || "");
  const claims = topic.claimsMeta ? `total: ${topic.claimsMeta.totalPropertyCount ?? "-"}, stored: ${topic.claimsMeta.storedPropertyCount ?? "-"}, truncated: ${topic.claimsMeta.truncated ? "ja" : "nein"}` : "keine Claims-Metadaten";
  return `<article class="topic-card">
    <h3 class="topic-title">${safeText(topic.title?.de || topic.title?.en || topic.wikidataId)}</h3>
    <div class="topic-sub">${safeText(topic.title?.en || "")}</div>
    <div class="topic-desc">${safeText(desc)}</div>
    <div class="meta">
      <span class="pill">${topic.wikidataId}</span><span class="pill">${topic.mainCategory}</span><span class="pill">${topic.topicType}</span>
      <span class="badge ${topic.status}">${topic.status}</span><span class="badge ${rev}">${rev}</span><span class="pill">${claims}</span>
    </div>
    <div class="badges">
      <span class="badge ${c.hasShortCard?"ok":"no"}">Short Card ${c.hasShortCard?"vorhanden":"fehlt"}</span>
      <span class="badge ${c.hasMediumCard?"ok":"no"}">Medium Card ${c.hasMediumCard?"vorhanden":"fehlt"}</span>
      <span class="badge ${c.hasLongCard?"ok":"no"}">Long Card ${c.hasLongCard?"vorhanden":"fehlt"}</span>
    </div>
    <div class="links">
      <a target="_blank" href="https://www.wikidata.org/wiki/${encodeURIComponent(topic.wikidataId)}">Wikidata öffnen</a>
      ${topic.sitelinks?.dewiki ? `<a target="_blank" href="${topic.sitelinks.dewiki}">Wikipedia DE öffnen</a>` : ""}
      ${topic.sitelinks?.enwiki ? `<a target="_blank" href="${topic.sitelinks.enwiki}">Wikipedia EN öffnen</a>` : ""}
    </div>
    <div class="actions">
      <button class="btn secondary" data-action="details" data-id="${topic.id}">Details</button>
      <button class="btn secondary" data-action="needs_review" data-id="${topic.id}">Als needs_review markieren</button>
      <button class="btn primary" data-action="approved" data-id="${topic.id}">Als approved markieren</button>
      <button class="btn danger" data-action="archive" data-id="${topic.id}">Archivieren</button>
    </div>
  </article>`;
}

function renderTopicCards(){
  const root = document.getElementById("topicList");
  if(!allTopics.length){ root.innerHTML = `<div class="empty">Noch keine Topics importiert. Importiere zuerst Themen über adm-wikidata-import.html.</div>`; return; }
  if(!filteredTopics.length){ root.innerHTML = `<div class="empty">Keine Topics für diese Filter gefunden.</div>`; return; }
  root.innerHTML = filteredTopics.map(renderTopicCard).join("");
}

async function quickUpdateTopic(topicId, changes){ try { await updateDoc(doc(db,"topics",topicId), { ...changes, updatedAt: serverTimestamp() }); showStatus("Änderungen gespeichert", "success"); await loadTopics(); } catch { showStatus("Fehler beim Speichern", "error"); } }
function archiveTopic(topicId){ return quickUpdateTopic(topicId,{ status:"archived" }); }

function renderDetailModal(topic){
  const c = getContentStatus(topic);
  document.getElementById("modalContent").innerHTML = `
    <div class="row"><h2 style="margin:0;">Details: ${safeText(topic.wikidataId)}</h2><span class="spacer"></span><button class="btn secondary" id="closeModalBtn">Schließen</button></div>
    <div class="kv">
      <div class="item"><div class="k">Wikidata-ID</div><div class="v">${safeText(topic.wikidataId)}</div></div>
      <div class="item"><div class="k">Titel DE/EN</div><div class="v">${safeText(topic.title?.de)} / ${safeText(topic.title?.en)}</div></div>
      <div class="item"><div class="k">Beschreibung DE/EN</div><div class="v">${safeText(topic.description?.de)}<hr>${safeText(topic.description?.en)}</div></div>
      <div class="item"><div class="k">Aliases DE/EN</div><div class="v">${(topic.aliases?.de||[]).join(", ")}<hr>${(topic.aliases?.en||[]).join(", ")}</div></div>
      <div class="item"><div class="k">Sitelinks</div><div class="v">DE: ${safeText(topic.sitelinks?.dewiki)}<br>EN: ${safeText(topic.sitelinks?.enwiki)}</div></div>
      <div class="item"><div class="k">Import</div><div class="v">Quelle: ${safeText(topic.import?.source)}<br>importedAt: ${formatDate(topic.import?.importedAt)}<br>lastFetchedAt: ${formatDate(topic.import?.lastFetchedAt)}</div></div>
    </div>
    <div class="kv">
      <div class="item"><div class="k">mainCategory</div><input id="editMainCategory" value="${safeText(topic.mainCategory)}"></div>
      <div class="item"><div class="k">topicType</div><input id="editTopicType" value="${safeText(topic.topicType)}"></div>
      <div class="item"><div class="k">tags (kommagetrennt)</div><input id="editTags" value="${safeText((topic.tags||[]).join(", "))}"></div>
      <div class="item"><div class="k">status</div><select id="editStatus"><option>imported</option><option>ready</option><option>draft</option><option>archived</option></select></div>
      <div class="item"><div class="k">reviewStatus</div><select id="editReviewStatus"><option>raw_import</option><option>needs_review</option><option>approved</option><option>rejected</option></select></div>
      <div class="item"><div class="k">sourceIds</div><div class="v">${(topic.sourceIds||[]).join(", ")}</div></div>
      <div class="item"><div class="k">contentStatus</div><div class="v">${JSON.stringify(c, null, 2).replace(/\n/g,'<br>')}</div></div>
      <div class="item"><div class="k">claimsMeta</div><div class="v">${topic.claimsMeta ? JSON.stringify(topic.claimsMeta) : "keine Claims-Metadaten"}</div></div>
    </div>
    <div class="row" style="margin-top:10px;"><button class="btn primary" id="saveDetailBtn">Änderungen speichern</button></div>
    <h3>JSON-Vorschau</h3><pre>${safeText(JSON.stringify(topic.raw, null, 2))}</pre>
    <details class="danger-zone"><summary>Danger Zone</summary>
      <p>Zum Löschen bitte exakt die Wikidata-ID eingeben.</p>
      <input id="deleteConfirmInput" placeholder="${safeText(topic.wikidataId)}" />
      <div class="row" style="margin-top:8px;"><button class="btn danger" id="deleteTopicBtn">Topic löschen</button></div>
    </details>
  `;
  document.getElementById("editStatus").value = topic.status;
  document.getElementById("editReviewStatus").value = getReviewStatus(topic);
  document.getElementById("closeModalBtn").onclick = closeDetailModal;
  document.getElementById("saveDetailBtn").onclick = ()=>saveTopicChanges(topic.id);
  document.getElementById("deleteTopicBtn").onclick = ()=>deleteTopic(topic.id);
}

async function openDetailModal(topicId){
  currentModalTopicId = topicId;
  try {
    const snap = await getDoc(doc(db, "topics", topicId));
    if(!snap.exists()) return showStatus("Topic nicht gefunden", "error");
    renderDetailModal(normalizeTopicDoc(snap));
    document.getElementById("detailModal").classList.add("show");
  } catch { showStatus("Fehler beim Laden", "error"); }
}
function closeDetailModal(){ document.getElementById("detailModal").classList.remove("show"); currentModalTopicId=null; }

async function saveTopicChanges(topicId){
  try {
    const data = {
      mainCategory: document.getElementById("editMainCategory").value.trim() || "unknown",
      topicType: document.getElementById("editTopicType").value.trim() || "unknown",
      tags: parseTagsInput(document.getElementById("editTags").value),
      status: document.getElementById("editStatus").value,
      "contentStatus.reviewStatus": document.getElementById("editReviewStatus").value,
      updatedAt: serverTimestamp()
    };
    await updateDoc(doc(db,"topics",topicId), data);
    showStatus("Änderungen gespeichert", "success");
    closeDetailModal();
    await loadTopics();
  } catch { showStatus("Fehler beim Speichern", "error"); }
}

async function deleteTopic(topicId){
  const topic = allTopics.find(t=>t.id===topicId); if(!topic) return;
  const val = document.getElementById("deleteConfirmInput")?.value?.trim();
  if(val !== topic.wikidataId) return showStatus("Löschung abgebrochen: Wikidata-ID stimmt nicht überein", "error");
  try { await deleteDoc(doc(db,"topics",topicId)); showStatus("Topic gelöscht", "success"); closeDetailModal(); await loadTopics(); }
  catch { showStatus("Fehler beim Speichern", "error"); }
}

async function handleLogin(){ try { await signInWithEmailAndPassword(auth, document.getElementById("emailInput").value.trim(), document.getElementById("passwordInput").value); } catch { showStatus("Login fehlgeschlagen", "error"); } }
async function handleLogout(){ await signOut(auth); }

function setupAuth(){
  // Sicherheit und Berechtigungen müssen final über Firestore Security Rules durchgesetzt werden.
  onAuthStateChanged(auth, async (user)=>{
    currentUser = user || null;
    document.getElementById("currentUserEmail").textContent = user?.email || "Nicht eingeloggt";
    document.getElementById("loginSection").style.display = user ? "none" : "block";
    document.getElementById("overviewSection").style.display = user ? "block" : "none";
    if(user) await loadTopics(); else { allTopics=[]; filteredTopics=[]; renderStats(); renderTopicCards(); }
  });
}

document.getElementById("loginBtn").addEventListener("click", handleLogin);
document.getElementById("logoutBtn").addEventListener("click", handleLogout);
document.getElementById("reloadBtn").addEventListener("click", loadTopics);
document.getElementById("topicList").addEventListener("click", (e)=>{
  const btn=e.target.closest("button[data-action]"); if(!btn) return;
  const id=btn.dataset.id, a=btn.dataset.action;
  if(a==="details") openDetailModal(id);
  if(a==="needs_review") quickUpdateTopic(id,{ "contentStatus.reviewStatus":"needs_review" });
  if(a==="approved") quickUpdateTopic(id,{ "contentStatus.reviewStatus":"approved", status:"ready" });
  if(a==="archive") archiveTopic(id);
});
document.getElementById("detailModal").addEventListener("click", (e)=>{ if(e.target.id==="detailModal") closeDetailModal(); });

initFirebase(); setupAuth(); renderStats(); renderTopicCards();
</script>
</body>
</html>
